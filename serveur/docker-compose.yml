services:
  proxy:
    image: nginx:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./key.pem:/etc/nginx/ssl/key.pem
      - ./cert.pem:/etc/nginx/ssl/cert.pem
    ports:
      - 8080:80
      - 8443:443
    networks:
      - interne
      - externe

  serveur:
    build:
      context: ./src
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./src:/src
    ports:
      - 8000:8000
    networks:
      - interne
  
  db:
    image: mcr.microsoft.com/mssql/server:latest
    env_file: .env
    volumes:
      - db_donnees:/var/opt/mssql
      - ./init_sql:/docker-entrypoint-initdb.d
    entrypoint: /docker-entrypoint-initdb.d/entrypoint.sh
    networks:
      - interne

networks:
  interne:
  externe:
    driver: bridge

volumes:
  db_donnees: